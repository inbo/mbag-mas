    in landbouwgebied van Vlaanderen
  subtitle: Aanzet tot een vereenvoudigde versie van het Meetnet Agrarische Soorten
    (“MAS light”)
  shorttitle: power-mas-light

  author:
  - name:
      given: Ward
      family: Langeraert
    email: ward.langeraert@inbo.be
    orcid: 0000-0002-5900-8109
    affiliation:
    - Instituut voor Natuur- en Bosonderzoek (INBO)
    corresponding: true

  reviewer:
  - name:
      given: Thierry
      family: Onkelinx
    email: thierry.onkelinx@inbo.be
    orcid: 0000-0001-8804-4216
    affiliation:
    - Instituut voor Natuur- en Bosonderzoek (INBO)

  rightsholder:
  - name:
      given: Instituut voor Natuur- en Bosonderzoek (INBO)
    email: info@inbo.be
    ror: 00j54wy13
  funder:
  - name:
      given: Instituut voor Natuur- en Bosonderzoek (INBO)
