    ror: 00j54wy13

  doi: 10.21436/inbor.152017328
  depotnr:
  year: 2026
  reportnr: 53
  cover: figures/cover.png
  coverphoto: figures/cover.png
  coverdescription: Visualisatie van de iteratieve optimalisatie van de detecteerbare effectgrootte voor een van de onderzochte simulatiescenario's. Via simulaties wordt de minimale waarde voor de parameter $\beta_3$ bepaald die een statistische power van 0,9 bereikt.

